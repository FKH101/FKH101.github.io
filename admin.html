<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理后台 — 数绘雄州</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23FAF8F5'/><text x='32' y='44' text-anchor='middle' font-size='32' font-family='SimSun,serif' fill='%23D4A24E' font-weight='bold'>雄</text></svg>">
<style>
:root {
  --bg: #FAF8F5; --bg-card: #FDF8F0; --text: #333; --text-dim: #8A8A8A;
  --gold-primary: #B5413E; --gold-dark: #8C2B28; --gold-bright: #D4A24E;
  --border: rgba(181,65,62,0.2); --border-hover: rgba(181,65,62,0.4);
  --success: #4CAF50; --danger: #E53935; --warning: #FF9800;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* Layout */
.admin-header { background: linear-gradient(135deg, var(--gold-dark), var(--gold-primary)); color: #fff; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
.admin-header h1 { font-size: 22px; letter-spacing: 3px; }
.admin-header .subtitle { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.admin-actions { display: flex; gap: 12px; }

.admin-layout { display: flex; min-height: calc(100vh - 80px); }
.admin-sidebar { width: 220px; background: #fff; border-right: 1px solid var(--border); padding: 20px 0; flex-shrink: 0; }
.admin-main { flex: 1; padding: 28px; overflow-y: auto; max-height: calc(100vh - 80px); }

/* Sidebar tabs */
.sidebar-item { padding: 12px 24px; cursor: pointer; font-size: 14px; color: var(--text); border-left: 3px solid transparent; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
.sidebar-item:hover { background: rgba(181,65,62,0.05); }
.sidebar-item.active { background: rgba(181,65,62,0.08); border-left-color: var(--gold-primary); color: var(--gold-primary); font-weight: 600; }
.sidebar-item .count { background: var(--gold-primary); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; }

/* Buttons */
.btn { padding: 8px 20px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
.btn-primary { background: var(--gold-primary); color: #fff; }
.btn-primary:hover { background: var(--gold-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { opacity: 0.9; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--gold-primary); color: var(--gold-primary); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* Content panels */
.panel { display: none; }
.panel.active { display: block; }
.panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.panel-header h2 { font-size: 22px; color: var(--gold-dark); letter-spacing: 2px; }

/* Item list */
.item-list { display: flex; flex-direction: column; gap: 12px; }
.item-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; display: flex; align-items: center; gap: 16px; transition: all 0.2s; }
.item-card:hover { border-color: var(--border-hover); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.item-card .item-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #f0ebe3; flex-shrink: 0; }
.item-card .item-info { flex: 1; min-width: 0; }
.item-card .item-info h4 { font-size: 15px; margin-bottom: 4px; color: var(--text); }
.item-card .item-info p { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .item-actions { display: flex; gap: 8px; flex-shrink: 0; }
.item-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
.badge-gold { background: rgba(212,162,78,0.15); color: #B8860B; }
.badge-red { background: rgba(181,65,62,0.1); color: var(--gold-primary); }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 680px; max-width: 90vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; border-radius: 16px 16px 0 0; }
.modal-header h3 { font-size: 18px; color: var(--gold-dark); }
.modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-dim); padding: 4px 8px; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; position: sticky; bottom: 0; background: #fff; border-radius: 0 0 16px 16px; }

/* Form */
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; transition: border-color 0.2s; background: var(--bg); }
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--gold-primary); }
.form-group textarea { min-height: 100px; resize: vertical; line-height: 1.8; }
.form-group .hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Toast */
.toast { position: fixed; bottom: 32px; right: 32px; background: var(--success); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 9999; opacity: 0; transform: translateY(20px); transition: all 0.3s; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: var(--danger); }

/* Dashboard */
.dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
.dash-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
.dash-card .dash-num { font-size: 36px; font-weight: 900; color: var(--gold-primary); }
.dash-card .dash-label { font-size: 13px; color: var(--text-dim); margin-top: 8px; }

/* Import/Export area */
.io-section { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.io-section h3 { font-size: 16px; margin-bottom: 12px; color: var(--gold-dark); }
.io-section p { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.8; }
.io-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

/* Empty state */
.empty-state { text-align: center; padding: 48px 24px; color: var(--text-dim); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state p { font-size: 14px; }

/* Responsive */
@media (max-width: 768px) {
  .admin-sidebar { width: 60px; }
  .sidebar-item span { display: none; }
  .sidebar-item .count { display: none; }
  .admin-main { padding: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .modal { width: 95vw; }
}
</style>
</head>

uote":"每一根芦苇都有灵性，我要做的是让它们在水中重新绽放。","detailPage":"inheritor.html"},{"id":"zhang-fulai","name":"张福来","title":"省级非遗代表性传承人","heritage":"雄州黑陶","portrait":"vibe_images/heritage-inheritor-02.webp","quote":"火候是黑陶的灵魂，差一分则色不正，多一刻则质不坚。"},{"id":"wang-shufang","name":"王淑芳","title":"省级非遗代表性传承人","heritage":"双堂盒子灯","portrait":"vibe_images/heritage-inheritor-03.webp","quote":"盒子灯机关之精妙，犹如微缩的宇宙。每一层转动都是古人对光明的向往。"},{"id":"zhao-hongliang","name":"赵洪亮","title":"省级非遗代表性传承人","heritage":"圈头村古乐","portrait":"vibe_images/heritage-inheritor-04.webp","quote":"古乐声声穿越千年，我们不是在演奏音乐，而是在与古人对话。"},{"id":"li-peiyao","name":"李佩瑶","title":"国家级非遗代表性传承人","heritage":"鹰爪翻子拳","portrait":"vibe_images/heritage-inheritor-05.webp","quote":"武术不只是技击，更是一种精神传承。每一招每一式都承载着先辈的智慧。"},{"id":"zhao-lianping","name":"赵连萍","title":"国家级非遗代表性传承人","heritage":"西河大鼓","portrait":"vibe_images/heritage-inheritor-06.webp","quote":"一鼓一板说尽人间百态，三弦伴奏唱遍古今传奇。这是属于我们中国人的说唱艺术。"}],"inheritorDetail":{"liu-yongli":{"name":"刘永利","title":"省级非遗代表性传承人","heritage":"白洋淀芦苇画","portrait":"vibe_images/inheritor-portrait.webp","birthYear":"1965年","origin":"河北安新","level":"省级代表性传承人","yearsOfCraft":"四十余年","representativeWork":"《芦雁归秋》","honor":"省级民间工艺金奖","bio":["刘永利，1965年生于河北省安新县白洋淀畔的一个匠人之家。自幼生长于淀区水乡，目之所及皆是随风摇曳的芦苇荡，耳濡目染间对这门以芦苇为材的民间艺术产生了深厚情感。少年时他便随父辈下淀收割芦苇，熟知不同季节芦苇的色泽与脾性，为日后从艺打下了坚实的根基。","1980年代初，刘永利正式拜入芦苇画老艺人门下，系统学习剪、割、刨、漂、压、烙、绘七道古法工序。十余年潜心钻研，他尤擅\u201c烙\u201d法——以烙铁温度之差在芦苇片上烫出深浅不一的褐色层次，使画面呈现水墨晕染般的意境。出师后，他扎根白洋淀畔开设工坊，将毕生精力倾注于芦苇画的创作与传承之中。","在艺术理念上，刘永利始终秉持\u201c顺物之性、循理而行\u201d的匠人哲学。他认为芦苇是有生命的材料，每一片都有独特的纹理与走向，创作时不可强求，须顺应其天然之势，方能令画面气韵生动。他在继承传统水乡题材的基础上，融入北方山水画的雄浑意境，逐渐形成了质朴苍润、层次分明的个人风格。","多年来，刘永利的作品先后入选省级民间工艺展览并屡获奖项，代表作《芦雁归秋》《淀泊晓雾》被多家美术馆收藏。他先后收徒数十人，并在当地中小学开设芦苇画兴趣课堂，致力于让这门古老技艺在水乡薪火相传。2015年，他被命名为白洋淀芦苇画省级非物质文化遗产代表性传承人。"],"skills":[{"title":"选材处理","description":"深秋至初冬，刘永利亲赴白洋淀荡中挑选秆直、壁厚、节少的成熟芦苇。芦苇收割后经剖秆、取膜、浸漂、压平等数道处理，去除杂质与卷曲，制成厚薄各异、色泽温润的芦苇薄片，为后续作画储备素材。他尤重\u201c因材施用\u201d——不同厚度对应不同色阶，最薄可至0.1毫米，凭手感便能辨出可用与否。"},{"title":"剪贴拼贴","description":"依设计图稿，将处理好的芦苇片裁剪成所需形状，再依画面层次逐层拼贴组合。刘永利善用芦苇天然的纹理走向表现羽毛、水波、芦叶等细节，以拼贴之巧营造画面的虚实与疏密，使平凡芦苇在方寸之间化为生动的花鸟山水。每一片落位皆经反复推敲，差之毫厘便重起一幅。"},{"title":"烙制定型","description":"以特制烙铁在芦苇片上烫出深浅不一的褐色，这是芦苇画最具技艺含量的核心环节。刘永利凭手感与经验控温，温度差之一度，色泽便深一层，层层叠烫间，水墨般的浓淡层次自然浮现。烙制定成后即行定型装裱，一幅芦苇画方告完成，可历久而不褪色。"}],"works":[{"title":"淀泊春晓","description":"春日淀区荷花初绽","image":"vibe_images/inheritor-work-01.webp"},{"title":"芦雁归秋","description":"秋日芦荡雁阵南归","image":"vibe_images/inheritor-work-02.webp"},{"title":"荷韵清夏","description":"盛夏荷塘清雅意境","image":"vibe_images/inheritor-work-03.webp"},{"title":"渔舟唱晚","description":"水乡傍晚渔舟归泊","image":"vibe_images/inheritor-work-04.webp"},{"title":"水乡人家","description":"淀区民俗生活场景","image":"vibe_images/inheritor-work-05.webp"},{"title":"百鸟朝凤","description":"精细鸟羽纹理之妙","image":"vibe_images/inheritor-work-06.webp"}]}},"categories":[{"icon":"🎨","name":"传统美术","description":"以芦苇画、黑陶为代表，展现水乡人民将自然材料化为艺术精品的卓越创造力。","items":"芦苇画 / 雄州黑陶","image":"vibe_images/heritage-category-01.webp"},{"icon":"🎵","name":"传统音乐","description":"圈头村古乐，源自宋代宫廷音乐的民间活化石，五大乐器合奏，曲调庄重典雅。","items":"圈头村古乐","image":"vibe_images/heritage-category-02.webp"},{"icon":"🥋","name":"传统体育","description":"鹰爪翻子拳，融合擒拿与连击的传统武术，刚柔并济，是北方武术的杰出代表。","items":"鹰爪翻子拳","image":"vibe_images/heritage-category-03.webp"},{"icon":"🎤","name":"曲艺","description":"西河大鼓，华北地区最具代表性的曲艺形式，说唱结合，传承数百年的民间说书艺术。","items":"西河大鼓","image":"vibe_images/heritage-category-04.webp"},{"icon":"🏮","name":"民俗","description":"双堂盒子灯，融合机械机关与纸扎工艺的传统灯彩，是民间信仰与节庆文化的重要载体。","items":"双堂盒子灯","image":"vibe_images/heritage-category-05.webp"}],"digitalPreservation":[{"title":"纹样数字化采集","description":"运用计算机视觉技术，对六大非遗项目的传统纹样进行系统性采集与数字化建档，建立雄安非遗纹样数据库。","stat":"2,400+","statLabel":"件纹样已入库","image":"vibe_images/heritage-digital-01.webp"},{"title":"AI 纹样创新生成","description":"基于 Stable Diffusion 模型，对传统纹样进行风格迁移与创新生成，在保留传统美学特征的同时创造全新的数字化纹样作品。","stat":"8,600+","statLabel":"幅 AI 生成作品","image":"vibe_images/heritage-digital-02.webp"},{"title":"技艺数字化记录","description":"对非遗传承人的核心技艺进行多角度影像记录与动作捕捉，建立非遗技艺数字档案，为后世传承留存珍贵的数字资料。","stat":"360+","statLabel":"小时影像记录","image":"vibe_images/heritage-digital-03.webp"}],"quotes":[{"text":"芦苇本是无情物，巧手翻作有情画。每一根芦苇都承载着白洋淀的水韵风华。","author":"白洋淀芦苇画传承人"},{"text":"黑陶之美，在于火候的精准把握。差一分则色不正，多一刻则质不坚。这是千年传承的匠心。","author":"雄州黑陶老艺人"},{"text":"盒子灯机关之精妙，犹如微缩的宇宙。每一层转动，都是古人对光明的向往。","author":"双堂盒子灯制作匠人"},{"text":"古乐声声，穿越千年。我们不是在演奏音乐，而是在与古人对话。","author":"圈头村古乐社传人"}],"news":[{"id":"news-01","title":"雄安非遗数字创新展在中国国家博物馆开幕","description":"本次展览集中展示雄安新区六大非遗项目的数字化创新成果，包括AIGC纹样重构、三维数字孪生、交互式非遗体验等，吸引众多市民和游客参观。展览将持续至2025年2月，预计接待观众超20万人次。","image":"vibe_images/news-card-01.webp","date":"2024.12.15","tag":"展览资讯","source":"雄安发布","link":"http://www.xiongan.gov.cn/20260613/cb401bde78994ceaa5a48542fad5e80f/c.html","featured":true},{"id":"news-02","title":"六大非遗传承人齐聚雄县展示百年技艺","description":"芦苇画、黑陶、盒子灯、古乐、翻子拳、西河大鼓六位国家级和省级传承人同台献艺，为公众带来一场沉浸式非遗文化盛宴。活动现场还设有体验区，观众可亲手体验芦苇剪贴和陶器拉坯等工艺。","image":"vibe_images/news-card-02.webp","date":"2024.11.28","tag":"活动报道","source":"雄安日报","link":"http://www.xiongan.gov.cn/20260613/cb401bde78994ceaa5a48542fad5e80f/c.html","featured":true},{"id":"news-03","title":"雄安新区出台非遗数字化保护新政策","description":"政策明确将每年投入专项资金用于非遗数字化采集、传承人补贴、数字化平台建设，为非遗保护提供制度保障。新政策还鼓励高校与企业参与非遗数字化创新，推动产学研深度融合。","image":"vibe_images/news-card-03.webp","date":"2024.10.20","tag":"政策法规","source":"管委会","link":"policy.html","featured":true},{"id":"news-04","title":"非遗文化进校园：雄县中小学开设非遗体验课","description":"雄县20所中小学引入非遗体验课程，邀请传承人走进课堂，让学生近距离感受芦苇画、黑陶等传统技艺的魅力。课程涵盖理论讲解与动手实践，每学期16课时。","image":"vibe_images/news-card-04.webp","date":"2024.09.10","tag":"教育传承","source":"教育局","link":"http://www.xiongan.gov.cn/20260613/cb401bde78994ceaa5a48542fad5e80f/c.html"},{"id":"news-05","title":"首届\u201cAIGC+非遗\u201d数字创作大赛启动报名","description":"面向全国高校和创作者征集以雄安非遗为灵感的AIGC数字作品，优秀作品将入选雄安非遗数字资源库并在展览中展出。大赛设金、银、铜奖及优秀指导教师奖，总奖金池30万元。","image":"vibe_images/news-card-05.webp","date":"2024.08.05","tag":"赛事活动","source":"数绘雄州","link":"http://www.xiongan.gov.cn/"},{"id":"news-06","title":"雄安非遗亮相国际文化遗产博览会","description":"雄安六大非遗项目及数字化创新成果在第五届国际文化遗产博览会上展出，向世界展示中国传统文化的数字新生。博览会期间，雄安展位接待 // ===== Init =====
async function init() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { data = JSON.parse(stored); } catch(e) { data = {}; }
  }
  const isSkeleton = data.meta && Array.isArray(data.heritage) && data.heritage.length === 0 && Array.isArray(data.news) && data.news.length === 0;
  const needsReload = !data.meta || !Array.isArray(data.news) || !Array.isArray(data.heritage) || !Array.isArray(data.policies) || isSkeleton;
  if (needsReload) {
    try {
      const res = await fetch('data/content.json');
      if (res.ok) {
        data = await res.json();
        saveData();
      } else {
        data = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveData();
      }
    } catch(e) {
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData();
    }
  }
  renderSidebar();
  showPanel('dashboard');
}

function saveData() {
  data.meta.lastModified = new Date().toISOString().split('T')[0];
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== Sidebar =====
function renderSidebar() {
  const items = [
    { id: 'dashboard', label: '数据总览', icon: '📊' },
    { id: 'heritage', label: '非遗项目', icon: '🏛️', count: data.heritage?.length || 0 },
    { id: 'inheritors', label: '传承人', icon: '👤', count: data.inheritors?.length || 0 },
    { id: 'news', label: '新闻动态', icon: '📰', count: data.news?.length || 0 },
    { id: 'policies', label: '政策法规', icon: '📋', count: data.policies?.length || 0 },
    { id: 'categories', label: '类别体系', icon: '📂', count: data.categories?.length || 0 },
    { id: 'digital', label: '数字化成果', icon: '💻', count: data.digitalPreservation?.length || 0 },
    { id: 'quotes', label: '匠人语录', icon: '💬', count: data.quotes?.length || 0 },
    { id: 'io', label: '导入/导出', icon: '🔄' },
  ];
  document.getElementById('sidebar').innerHTML = items.map(item =>
    `<div class="sidebar-item ${item.id === currentPanel ? 'active' : ''}" onclick="showPanel('${item.id}')">
      <span>${item.icon}</span><span>${item.label}</span>
      ${item.count !== undefined ? `<span class="count">${item.count}</span>` : ''}
    </div>`
  ).join('');
}

// ===== Panels =====
function showPanel(id) {
  currentPanel = id;
  renderSidebar();
  const main = document.getElementById('mainContent');

  if (id === 'dashboard') return renderDashboard(main);
  if (id === 'io') return renderIO(main);

  const config = {
    heritage: { title: '非遗项目管理', key: 'heritage', fields: heritageFields },
    inheritors: { title: '传承人管理', key: 'inheritors', fields: inheritorFields },
    news: { title: '新闻动态管理', key: 'news', fields: newsFields },
    policies: { title: '政策法规管理', key: 'policies', fields: policyFields },
    categories: { title: '类别体系管理', key: 'categories', fields: categoryFields },
    digital: { title: '数字化成果管理', key: 'digitalPreservation', fields: digitalFields },
    quotes: { title: '匠人语录管理', key: 'quotes', fields: quoteFields },
  };
  const c = config[id];
  if (!c) return;
  renderListPanel(main, c.title, c.key, c.fields);
}

function renderDashboard(el) {
  const counts = {
    heritage: data.heritage?.length || 0,
    inheritors: data.inheritors?.length || 0,
    news: data.news?.length || 0,
    policies: data.policies?.length || 0,
    categories: data.categories?.length || 0,
    digital: data.digitalPreservation?.length || 0,
    quotes: data.quotes?.length || 0,
  };
  el.innerHTML = `
    <div class="panel-header"><h2>数据总览</h2></div>
    <div class="dashboard-grid">
      <div class="dash-card"><div class="dash-num">${counts.heritage}</div><div class="dash-label">非遗项目</div></div>
      <div class="dash-card"><div class="dash-num">${counts.inheritors}</div><div class="dash-label">传承人</div></div>
      <div class="dash-card"><div class="dash-num">${counts.news}</div><div class="dash-label">新闻动态</div></div>
      <div class="dash-card"><div class="dash-num">${counts.policies}</div><div class="dash-label">政策法规</div></div>
      <div class="dash-card"><div class="dash-num">${counts.categories}</div><div class="dash-label">类别体系</div></div>
      <div class="dash-card"><div class="dash-num">${counts.quotes}</div><div class="dash-label">匠人语录</div></div>
    </div>
    <div class="io-section">
      <h3>数据状态</h3>
      <p>当前数据最后修改时间：${data.meta?.lastModified || '未知'}<br>
      数据来源：${localStorage.getItem(STORAGE_KEY) ? '本地缓存（已修改）' : '原始 content.json'}</p>
      <div class="io-buttons">
        <button class="btn btn-primary" onclick="showPanel('io')">管理数据</button>
        <button class="btn btn-danger" onclick="resetData()">重置为默认数据</button>
      </div>
    </div>`;
}

function renderIO(el) {
  el.innerHTML = `
    <div class="panel-header"><h2>导入 / 导出数据</h2></div>
    <div class="io-section">
      <h3>导出数据</h3>
      <p>将当前所有管理数据导出为 JSON 文件。导出的文件可以替换 data/content.json，或直接导入到本系统中。</p>
      <div class="io-buttons">
        <button class="btn btn-primary" onclick="exportJSON()">导出 content.json</button>
      </div>
    </div>
    <div class="io-section">
      <h3>导入数据</h3>
      <p>从 JSON 文件导入数据。导入后将覆盖当前所有数据，请谨慎操作。建议先导出当前数据作为备份。</p>
      <div class="io-buttons">
        <button class="btn btn-outline" onclick="importJSON()">选择 JSON 文件导入</button>
      </div>
    </div>
    <div class="io-section">
      <h3>重置数据</h3>
      <p>清除本地缓存的所有修改，恢复为 data/content.json 中的原始数据。此操作不可撤销。</p>
      <div class="io-buttons">
        <button class="btn btn-danger" onclick="resetData()">重置所有数据</button>
      </div>
    </div>
    <div class="io-section">
      <h3>使用说明</h3>
      <p style="line-height:2.2">
        1. 在左侧菜单选择要编辑的内容类型，点击"添加"按钮新增内容<br>
        2. 点击已有内容的"编辑"按钮修改信息，"删除"按钮移除内容<br>
        3. 所有修改自动保存在浏览器本地存储中<br>
        4. 点击"导出 JSON"下载更新后的数据文件<br>
        5. 将导出的文件替换网站 data/content.json 即可更新网站内容<br>
        6. 如需在其他电脑编辑，可导出后携带 JSON 文件
      </p>
    </div>`;
}

  { key: 'title', label: '称号', type: 'text', hint: '如：省级非遗代表性传承人' },
  { key: 'heritage', label: '非遗项目', type: 'text' },
  { key: 'quote', label: '语录', type: 'textarea' },
  { key: 'portrait', label: '肖像路径', type: 'text', hint: '如：vibe_images/heritage-inheritor-01.webp' },
  { key: 'detailPage', label: '详情页', type: 'text' },
];

const newsFields = [
  { key: 'title', label: '标题', type: 'text', required: true },
  { key: 'description', label: '摘要', type: 'textarea' },
  { key: 'date', label: '日期', type: 'text', hint: '格式：2024.12.15' },
  { key: 'tag', label: '标签', type: 'select', options: ['展览资讯','活动报道','政策法规','教育传承','赛事活动','文化交流','平台建设','传承人风采','影像记录','产业创新','志愿服务','年度回顾'] },
  { key: 'source', label: '来源', type: 'text' },
  { key: 'image', label: '图片路径', type: 'text' },
  { key: 'link', label: '链接', type: 'text' },
  { key: 'featured', label: '置顶', type: 'select', options: ['false', 'true'] },
];

const policyFields = [
  { key: 'number', label: '编号', type: 'text', required: true },
  { key: 'title', label: '名称', type: 'text', required: true },
  { key: 'meta', label: '元信息', type: 'text', hint: '格式：颁布日期：xxx · 颁布机构：xxx' },
  { key: 'description', label: '描述', type: 'textarea' },
  { key: 'link', label: '原文链接', type: 'text' },
];

const categoryFields = [
  { key: 'name', label: '类别名称', type: 'text', required: true },
  { key: 'icon', label: '图标', type: 'text', hint: 'Emoji，如 🎨' },
  { key: 'description', label: '描述', type: 'textarea' },
  { key: 'items', label: '包含项目', type: 'text', hint: '如：芦苇画 / 雄州黑陶' },
  { key: 'image', label: '图片路径', type: 'text' },
];

const digitalFields = [
  { key: 'title', label: '标题', type: 'text', required: true },
  { key: 'description', label: '描述', type: 'textarea' },
  { key: 'stat', label: '数据', type: 'text', hint: '如：2,400+' },
  { key: 'statLabel', label: '数据标签', type: 'text', hint: '如：件纹样已入库' },
  { key: 'image', label: '图片路径', type: 'text' },
];

const quoteFields = [
  { key: 'text', label: '语录内容', type: 'textarea', required: true },
  { key: 'author', label: '出处', type: 'text', hint: '如：白洋淀芦苇画传承人' },
];

// ===== List Panel =====
function renderListPanel(el, title, key, fields) {
  const items = data[key] || [];
  el.innerHTML = `
    <div class="panel-header">
      <h2>${title}</h2>
      <button class="btn btn-primary" onclick="openAddModal('${key}')">+ 添加</button>
    </div>
    <div class="item-list" id="itemList">
      ${items.length === 0 ? '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无内容，点击上方"添加"按钮新增</p></div>' : ''}
      ${items.map((item, i) => renderItemCard(item, i, key, fields)).join('')}
    </div>`;
}

function renderItemCard(item, index, key, fields) {
  const titleField = fields[0];
  const subtitleField = fields[1];
  const title = item[titleField.key] || '未命名';
  const subtitle = item[subtitleField.key] || '';
  const img = item.image || item.portrait || '';

  return `<div class="item-card">
    ${img ? `<img class="item-thumb" src="${img}" alt="" onerror="this.style.background='#f0ebe3'">` : '<div class="item-thumb"></div>'}
    <div class="item-info">
      <h4>${title}</h4>
      <p>${subtitle}</p>
    </div>
    <div class="item-actions">
      <button class="btn btn-outline btn-sm" onclick="openEditModal('${key}', ${index})">编辑</button>
      <button class="btn btn-danger btn-sm" onclick="deleteItem('${key}', ${index})">删除</button>
    </div>
  </div>`;
}

// ===== Modal =====
function openModal(title, bodyHTML, footerHTML) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modalFooter').innerHTML = footerHTML;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function openAddModal(key) {
  const fieldDefs = getFieldDefs(key);
  const body = buildForm(fieldDefs, {});
  openModal('添加内容', body, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveNew('${key}')">保存</button>
  `);
}

function openEditModal(key, index) {
  const fieldDefs = getFieldDefs(key);
  const item = data[key][index];
  const body = buildForm(fieldDefs, item);
  openModal('编辑内容', body, `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="saveEdit('${key}', ${index})">保存修改</button>
  `);
}

function getFieldDefs(key) {
  const map = { heritage: heritageFields, inheritors: inheritorFields, news: newsFields, policies: policyFields, categories: categoryFields, digitalPreservation: digitalFields, quotes: quoteFields };
  return map[key] || [];
}

function buildForm(fields, item) {
  return fields.map(f => {
    const val = item[f.key] ?? '';
    let input;
    if (f.type === 'textarea') {
      input = `<textarea id="field_${f.key}" rows="4">${escHTML(val)}</textarea>`;
    } else if (f.type === 'select') {
      input = `<select id="field_${f.key}">${f.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
    } else {
      input = `<input type="text" id="field_${f.key}" value="${escHTML(val)}">`;
    }
    return `<div class="form-group">
      <label>${f.label}${f.required ? ' *' : ''}</label>
      ${input}
      ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    </div>`;
  }).join('');
}

function collectForm(fields) {
  const result = {};
  fields.forEach(f => {
    const el = document.getElementById('field_' + f.key);
    let val = el.value.trim();
    if (f.key === 'featured') val = val === 'true';
    result[f.key] = val;
  });
  return result;
}

function saveNew(key) {
  const fields = getFieldDefs(key);
  const item = collectForm(fields);
  if (!data[key]) data[key] = [];
  data[key].push(item);
  if (!item.id) item.id = key + '-' + Date.now();
  saveData();
  closeModal();
  showPanel(getPanelForKey(key));
  showToast('添加成功');
}

function saveEdit(key, index) {
  const fields = getFieldDefs(key);
  const item = collectForm(fields);
  Object.assign(data[key][index], item);
  saveData();
  closeModal();
  showPanel(getPanelForKey(key));
  showToast('修改已保存');
}

function deleteItem(key, index) {
  if (!confirm('确定要删除这条内容吗？此操作不可撤销。')) return;
  data[key].splice(index, 1);
  saveData();
  showPanel(getPanelForKey(key));
  showToast('已删除');
}

function getPanelForKey(key) {
  const map = { heritage: 'heritage', inheritors: 'inheritors', news: 'news', policies: 'policies', categories: 'categories', digitalPreservation: 'digital', quotes: 'quotes' };
  return map[key] || 'dashboard';
}

// ===== Import / Export =====
function exportJSON() {
  saveData();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'content.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON 已导出，请替换 data/content.json');
}

function importJSON() {
  document.getElementById('fileInput').click();
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!imported.meta) throw new Error('文件格式不正确');
      data = imported;
      saveData();
      renderSidebar();
      showPanel('dashboard');
      showToast('导入成功');
    } catch(err) {
      showToast('导入失败：JSON 格式错误', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('确定要重置所有数据吗？本地修改将全部丢失。')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ===== Utils =====
function escHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 2500);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
